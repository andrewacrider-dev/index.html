<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My API-Powered Chart</title>

    <!-- 1. Load the Google Charts API -->
    <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
    
    <!-- 2. Load jQuery (Required for the AJAX-style data fetching) -->
    <script type="text/javascript" src="https://ajax.googleapis.com/ajax/libs/jquery/1.10.2/jquery.min.js"></script>

    <script type="text/javascript">
        // Load the Visualization API and the corechart package
        google.charts.load('current', {'packages':['corechart']});

        // Set a callback to run when the Google Visualization API is loaded
        google.charts.setOnLoadCallback(drawChart);

        function drawChart() {
            /* 
               3. THE JSON INTERFACE (Simulated API)
               In a real-world scenario, 'jsonData' would come from a URL like 'api/data.json'.
               For your GitHub version, we define the JSON structure here so it works instantly.
            */
            var mockApiResponse = {
                "cols": [
                    {"id":"","label":"Topping","pattern":"","type":"string"},
                    {"id":"","label":"Slices","pattern":"","type":"number"}
                ],
                "rows": [
                    {"c":[{"v":"Mushrooms","f":null},{"v":3,"f":null}]},
                    {"c":[{"v":"Onions","f":null},{"v":1,"f":null}]},
                    {"c":[{"v":"Olives","f":null},{"v":1,"f":null}]},
                    {"c":[{"v":"Zucchini","f":null},{"v":1,"f":null}]},
                    {"c":[{"v":"Pepperoni","f":null},{"v":2,"f":null}]}
                ]
            };

            // Convert our JSON object into a Google DataTable
            var data = new google.visualization.DataTable(mockApiResponse);

            // 4. Set Chart Options
            var options = {
                title: 'My Pizza Consumption (API Data)',
                width: '100%',
                height: 400,
                is3D: true
            };

            // 5. Instantiate and draw the chart
            var chart = new google.visualization.PieChart(document.getElementById('chart_div'));
            chart.draw(data, options);
        }
    </script>
</head>
<body>
    <h1>My Website Data Visualization</h1>
    <p>This chart is powered by a JSON interface and the Google Charts API.</p>
    
    <!-- This is the container where the chart will be rendered -->
    <div id="chart_div" style="border: 1px solid #ccc;"></div>

    <footer style="margin-top: 20px; font-size: 0.8em;">
        <p>Learning Progress: API and JSON Integration Complete.</p>
    </footer>
</body>
</html>
