<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Avionics MCU Terminal</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0d1117;
      color: #39ff14;
      font-family: 'Courier New', Courier, monospace;
      padding: 24px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
    }

    .terminal-wrapper {
      width: 100%;
      max-width: 900px;
      background-color: #050805;
      border: 2px solid #39ff14;
      border-radius: 6px;
      padding: 20px;
      box-shadow: 0 0 15px rgba(57, 255, 20, 0.2);
    }

    .terminal-header {
      display: flex;
      justify-content: space-between;
      border-bottom: 2px solid #39ff14;
      padding-bottom: 10px;
      margin-bottom: 16px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .mcu-container {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .mcu-entry {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      padding: 8px;
      border-bottom: 1px dashed rgba(57, 255, 20, 0.3);
      align-items: center;
    }

    .mcu-col-a {
      color: #88ff88;
      font-weight: bold;
      min-width: 140px;
    }

    .mcu-col-b {
      flex: 1;
      color: #39ff14;
    }

    .mcu-col-c {
      color: #a3e635;
    }

    .mcu-link {
      color: #000;
      background-color: #39ff14;
      padding: 2px 8px;
      text-decoration: none;
      font-weight: bold;
      border-radius: 2px;
    }

    .mcu-link:hover {
      background-color: #ffffff;
      color: #000000;
    }

    .status-msg {
      color: #facc15;
      padding: 12px;
    }

    .status-err {
      color: #ef4444;
      padding: 12px;
    }
  </style>
</head>
<body>

  <div class="terminal-wrapper">
    <div class="terminal-header">
      <span>SYSTEM: MCU DATA LINK</span>
      <span id="system-clock">UTC 00:00:00</span>
    </div>

    <!-- MCU Terminal Output Box -->
    <div id="mcu-display" class="mcu-container">
      <div class="status-msg">> INITIALIZING DATA LINK WITH SPREADSHEET...</div>
    </div>
  </div>

  <script>
    // =========================================================================
    // CONFIGURATION: Verified Sheet ID plugged in
    // =========================================================================
    const SHEET_ID = '1tscWByPbdTPM6SHB4dNimrzRu7FQUbrNWX5SyX06d8U';
    const SHEET_TAB_NAME = 'MCU';

    // Google Visualization API Endpoint (Public JSON Feed)
    const MCU_FEED_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(SHEET_TAB_NAME)}`;

    // Update terminal clock
    function updateClock() {
      const now = new Date();
      document.getElementById('system-clock').textContent = 'UTC ' + now.toUTCString().split(' ')[4];
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Fetch and render Google Sheet rows
    async function loadMCUFromSheet() {
      const display = document.getElementById('mcu-display');

      try {
        const response = await fetch(MCU_FEED_URL);
        if (!response.ok) {
          throw new Error(`HTTP Error ${response.status} (Check tab name matches "${SHEET_TAB_NAME}")`);
        }

        const rawText = await response.text();

        // Extract valid JSON from the Google Visualization response wrapper
        const jsonStart = rawText.indexOf('{');
        const jsonEnd = rawText.lastIndexOf('}');
        const cleanJsonString = rawText.substring(jsonStart, jsonEnd + 1);

        const parsedData = JSON.parse(cleanJsonString);
        const rows = parsedData.table.rows;

        display.innerHTML = '';

        if (!rows || rows.length === 0) {
          display.innerHTML = '<div class="status-msg">> NO MCU LOG ENTRIES DETECTED.</div>';
          return;
        }

        // Loop through each row in the Sheet
        rows.forEach(row => {
          const colA = row.c && row.c[0] ? (row.c[0].f || row.c[0].v || '') : '';
          const colB = row.c && row.c[1] ? (row.c[1].f || row.c[1].v || '') : '';
          const colC = row.c && row.c[2] ? (row.c[2].f || row.c[2].v || '') : '';

          const entryDiv = document.createElement('div');
          entryDiv.className = 'mcu-entry';

          // Render column C as a button link if it is an HTTP/HTTPS URL
          let actionMarkup = `<span class="mcu-col-c">${colC}</span>`;
          if (typeof colC === 'string' && (colC.startsWith('http://') || colC.startsWith('https://'))) {
            actionMarkup = `<a href="${colC}" target="_blank" rel="noopener noreferrer" class="mcu-link">[VERIFY EVENT]</a>`;
          }

          entryDiv.innerHTML = `
            <span class="mcu-col-a">> ${colA}</span>
            <span class="mcu-col-b">${colB}</span>
            ${actionMarkup}
          `;

          display.appendChild(entryDiv);
        });

      } catch (err) {
        console.error('MCU Data Link Error:', err);
        display.innerHTML = `<div class="status-err">> LINK OFFLINE: ${err.message}. Ensure the tab at the bottom is named "${SHEET_TAB_NAME}".</div>`;
      }
    }

    // Load data on page launch and re-poll every 60 seconds
    document.addEventListener('DOMContentLoaded', () => {
      loadMCUFromSheet();
      setInterval(loadMCUFromSheet, 60000);
    });
  </script>
</body>
</html>
