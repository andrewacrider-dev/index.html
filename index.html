<style>
  .mcu-dock-wrapper {
    width: 100%;
    margin-top: 30px;
    margin-bottom: 20px;
    box-sizing: border-box;
    font-family: 'Courier New', Courier, monospace;
  }

  .terminal-card {
    background-color: #040804;
    border: 1px solid #33ff33;
    border-radius: 4px;
    padding: 16px;
    box-shadow: 0 0 12px rgba(51, 255, 51, 0.15);
  }

  .terminal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid rgba(51, 255, 51, 0.4);
    padding-bottom: 8px;
    margin-bottom: 12px;
    font-weight: bold;
    color: #33ff33;
  }

  .mcu-container {
    display: flex;
    flex-direction: column;
    gap: 8px;
    max-height: 480px;
    overflow-y: auto;
  }

  .mcu-entry {
    display: grid;
    grid-template-columns: 140px 1.5fr 1fr auto;
    gap: 12px;
    align-items: baseline;
    padding: 8px;
    background-color: rgba(51, 255, 51, 0.03);
    border-left: 3px solid #33ff33;
    border-bottom: 1px dashed rgba(51, 255, 51, 0.2);
  }

  .mcu-date {
    color: #88ff88;
    font-weight: bold;
    font-size: 0.9rem;
  }

  .mcu-name {
    color: #ffffff;
    font-weight: bold;
  }

  .mcu-meta {
    color: #70d670;
    font-size: 0.85rem;
  }

  .mcu-location {
    display: block;
    color: #33ff33;
  }

  .mcu-tags {
    display: inline-block;
    font-size: 0.75rem;
    color: #a3e635;
    opacity: 0.85;
  }

  .mcu-link-btn {
    background-color: #33ff33;
    color: #000000;
    padding: 2px 8px;
    text-decoration: none;
    font-weight: bold;
    font-size: 0.8rem;
    border-radius: 2px;
  }

  .mcu-link-btn:hover {
    background-color: #ffffff;
    color: #000000;
  }

  .status-warn { color: #facc15; }
  .status-err  { color: #ef4444; }

  @media (max-width: 768px) {
    .mcu-entry {
      grid-template-columns: 1fr;
      gap: 6px;
    }
  }
</style>

<div class="mcu-dock-wrapper">
  <div class="terminal-card">
    <div class="terminal-header">
      <span>SYSTEM: MCU TELEMETRY & EVENT DISPATCH</span>
      <span id="mcu-clock">UTC --:--:--</span>
    </div>
    <div id="mcu-display" class="mcu-container">
      <div class="mcu-status-line status-warn">> SYNCHRONIZING WITH MCU REPOSITORY...</div>
    </div>
  </div>
</div>

<script>
  (function() {
    const MCU_CONFIG = {
      sheetId: '1tscWByPbdTPM6SHB4dNimrzRu7FQUbrNWX5SyX06d8U',
      tabName: 'MCU',
      pollIntervalMs: 60000
    };

    const MCU_ENDPOINT = `https://docs.google.com/spreadsheets/d/${MCU_CONFIG.sheetId}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(MCU_CONFIG.tabName)}`;

    function updateMCUClock() {
      const clock = document.getElementById('mcu-clock');
      if (clock) {
        const now = new Date();
        clock.textContent = 'UTC ' + now.toUTCString().split(' ')[4];
      }
    }
    setInterval(updateMCUClock, 1000);
    updateMCUClock();

    async function fetchMCUEvents() {
      const container = document.getElementById('mcu-display');
      if (!container) return;

      try {
        const response = await fetch(MCU_ENDPOINT);
        if (!response.ok) {
          throw new Error(`HTTP ${response.status} (Confirm tab is titled '${MCU_CONFIG.tabName}')`);
        }

        const raw = await response.text();
        const jsonStart = raw.indexOf('{');
        const jsonEnd = raw.lastIndexOf('}');
        const data = JSON.parse(raw.substring(jsonStart, jsonEnd + 1));
        const rows = data.table.rows;

        container.innerHTML = '';

        if (!rows || rows.length === 0) {
          container.innerHTML = '<div class="mcu-status-line status-warn">> NO MCU ENTRIES LOGGED</div>';
          return;
        }

        // Columns: Col A=Date, Col B=Name, Col C=Nation, Col D=State, Col E=Location, Col F=Tag, Col G=Notes
        rows.forEach(row => {
          const getVal = (idx) => {
            if (!row.c || !row.c[idx]) return '';
            return (row.c[idx].f || row.c[idx].v || '').toString().trim();
          };

          const date     = getVal(0);
          const name     = getVal(1);
          const state    = getVal(3);
          const location = getVal(4);
          const tags     = getVal(5);
          const notes    = getVal(6);

          if (!date && !name) return;

          const rowEl = document.createElement('div');
          rowEl.className = 'mcu-entry';

          let actionMarkup = '';
          if (notes.startsWith('http://') || notes.startsWith('https://')) {
            actionMarkup = `<a href="${notes}" target="_blank" rel="noopener noreferrer" class="mcu-link-btn">[VERIFY]</a>`;
          } else if (notes) {
            actionMarkup = `<span class="mcu-meta">${notes}</span>`;
          }

          const locationDisplay = [location, state].filter(Boolean).join(', ');

          rowEl.innerHTML = `
            <span class="mcu-date">${date}</span>
            <div class="mcu-info">
              <div class="mcu-name">${name}</div>
              ${tags ? `<span class="mcu-tags">[${tags}]</span>` : ''}
            </div>
            <div class="mcu-meta">
              ${locationDisplay ? `<span class="mcu-location">${locationDisplay}</span>` : ''}
            </div>
            <div class="mcu-action">
              ${actionMarkup}
            </div>
          `;

          container.appendChild(rowEl);
        });

      } catch (err) {
        console.error('MCU Synchronization Failed:', err);
        container.innerHTML = `<div class="mcu-status-line status-err">> TELEMETRY LINK ERROR: ${err.message}</div>`;
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', fetchMCUEvents);
    } else {
      fetchMCUEvents();
    }
    setInterval(fetchMCUEvents, MCU_CONFIG.pollIntervalMs);
  })();
</script>
